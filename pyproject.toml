[project]
name = "ai-gis-qgis"
version = "0.1.0"
description = "QGIS AI GIS Agent plugin"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# QGIS ships its own qgis.PyQt modules at runtime. Use this extra only for
# local UI experiments outside QGIS, not inside the QGIS plugin Python path.
local-ui = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.16",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "backend",
    "database",
    "scripts",
]
exclude = [
    ".venv",
    "config",
    "frontend",
    "plugin.py",
    "qwebengine",
    "resources/frontend_dist",
]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
